name: "打包发布版本"
on:
    push:
        branches:
            - master
        paths:
            - gradle.properties
    workflow_dispatch:

permissions:
    contents: write

env:
    BRANCH_NAME: master

jobs:
    build-and-release:
        runs-on: ubuntu-latest
        env:
            GIT_USER_NAME: "wdk"
            # 将 GitHub 上下文值通过 env 注入，避免在 shell 中直接插值 ${{ }}（防注入）
            EVENT_NAME: ${{ github.event_name }}
            EVENT_BEFORE: ${{ github.event.before }}
            REPOSITORY: ${{ github.repository }}
        steps:
            # 检出完整历史并拉取 tag：既支持 before..HEAD 区间比较，也支持后续 tag 清理
            -   name: "检出仓库代码"
                uses: actions/checkout@v7
                with:
                    ref: ${{ env.BRANCH_NAME }}
                    fetch-depth: 0
                    fetch-tags: true

            -   name: "解析版本与元数据"
                id: resolve
                shell: bash
                run: |
                    set -euo pipefail

                    # 从 gradle.properties 精确读取指定键的值，并去掉首尾空白与 \r
                    read_prop() {
                        awk -F= -v key="$1" '
                            $1 == key {
                                value = substr($0, index($0, "=") + 1)
                                gsub(/^[ \t]+|[ \t\r]+$/, "", value)
                                print value
                                exit
                            }
                        ' gradle.properties
                    }

                    PLUGIN_NAME="$(read_prop plugin.name)"
                    PLUGIN_VERSION="$(read_prop plugin.version)"
                    VENDOR_EMAIL="$(read_prop plugin.vendor.email)"

                    # 版本变更仅作诊断，不再作为发布开关：
                    # 新规要求 workflow 一旦触发就必须完整走完发布链路，版本相同则覆盖已有 Release / asset。
                    # 因此 before 为空/全 0/被 amend 或 force push 改写而不可达、diff 失败等情况
                    # 都不再导致跳过，只记录到日志便于下次定位 push 事件语义。
                    VERSION_DIFF=""
                    if [[ -z "${EVENT_BEFORE}" || "${EVENT_BEFORE}" == "0000000000000000000000000000000000000000" ]]; then
                        echo "诊断：EVENT_BEFORE 为空或全 0，无法做区间比较（不影响本次发布）"
                    elif ! VERSION_DIFF="$(git diff "${EVENT_BEFORE}" HEAD -- gradle.properties 2>/dev/null)"; then
                        echo "诊断：before=${EVENT_BEFORE} 不在本地对象库（可能已被 amend/force push 改写），区间比较失败（不影响本次发布）"
                        VERSION_DIFF=""
                    fi

                    if [[ -n "${VERSION_DIFF}" ]]; then
                        echo "诊断：before..HEAD 的 gradle.properties 差异："
                        echo "${VERSION_DIFF}"
                        if [[ "${VERSION_DIFF}" == *"+plugin.version="* ]]; then
                            echo "诊断：区间内检测到 plugin.version 变更（仅记录，不控制发布）"
                        else
                            echo "诊断：区间内未检测到 plugin.version 变更（仅记录，不控制发布）"
                        fi
                    else
                        echo "诊断：before..HEAD 无 gradle.properties 差异或不可比较（仅记录，不控制发布）"
                    fi

                    # 手动与 push 两种触发下，待发布版本均取当前 gradle.properties 中的版本，
                    # 保证 tag / 下载地址 / release 使用同一个值，避免多处解析产生偏差
                    RELEASE_VERSION="${PLUGIN_VERSION}"

                    # 下载地址由 tag + 文件名确定，与 updatePlugins.xml 的 <download-url> 共用同一个计算值，避免漂移
                    DOWNLOAD_URL="https://github.com/${REPOSITORY}/releases/download/v${RELEASE_VERSION}/${PLUGIN_NAME}-${RELEASE_VERSION}.zip"

                    {
                        echo "release-version=${RELEASE_VERSION}"
                        echo "plugin-name=${PLUGIN_NAME}"
                        echo "vendor-email=${VENDOR_EMAIL}"
                        echo "download-url=${DOWNLOAD_URL}"
                    } >> "${GITHUB_OUTPUT}"

                    echo "诊断：触发类型=${EVENT_NAME}，EVENT_BEFORE=${EVENT_BEFORE:-（空）}，目标版本=${RELEASE_VERSION}，发布策略=始终发布（同版本覆盖）"

            # 新规：workflow 一旦触发，以下步骤全部无条件执行，不存在"版本未变就跳过"的分支。
            # 同版本再次发布由 release-action 的 allowUpdates + replacesArtifacts 覆盖已有 Release / asset。
            -   name: "设置 JDK21"
                uses: actions/setup-java@v6
                with:
                    distribution: 'temurin'
                    java-version: '21'
                    cache: 'gradle'

            # IntelliJ Platform 插件 2.x 把 IDE 元数据（Maven metadata、productReleases、
            # IDE layout index）写入项目根 .intellijPlatform/，该目录被 .gitignore 排除，
            # CI 每次全新下载。它与 setup-java 的 ~/.gradle/caches 完全不重叠，单独缓存
            # 可加速 buildPlugin，同时消除了原先两处缓存都指向 ~/.gradle/caches 的重复恢复/保存。
            -   name: "缓存 IntelliJ Platform 元数据"
                uses: actions/cache@v6
                with:
                    path: |
                        .intellijPlatform/ides
                        .intellijPlatform/localPlatformArtifacts
                        .intellijPlatform/productReleases
                        .intellijPlatform/*.xml
                        .intellijPlatform/*.etag
                    key: ${{ runner.os }}-ijp-${{ hashFiles('build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
                    restore-keys: |
                        ${{ runner.os }}-ijp-

            -   name: "清理 Git Tag"
                env:
                    RELEASE_VERSION: ${{ steps.resolve.outputs.release-version }}
                run: |
                    set -euo pipefail

                    # 目标 tag 已存在则先删（本地 + 远端），保持原有清理语义；
                    # 覆盖 Release 不依赖该 git tag：release-action 按 Release 的 tag_name 查找已有对象
                    TARGET_TAG="v${RELEASE_VERSION}"
                    if [[ -n "$(git tag --list "${TARGET_TAG}")" ]]; then
                        echo "标签 ${TARGET_TAG} 已存在，删除后由发布步骤按 Release tag_name 覆盖..."
                        git tag -d "${TARGET_TAG}"
                        git push origin --delete "${TARGET_TAG}" || echo "远端无 ${TARGET_TAG}，跳过"
                    fi

                    # 保留原有行为：删除所有含 SNAPSHOT 的历史预览标签，避免与正式发布标签混淆
                    SNAPSHOT_TAGS="$(git tag --list '*SNAPSHOT*')"
                    if [[ -n "${SNAPSHOT_TAGS}" ]]; then
                        while IFS= read -r tag; do
                            [[ -z "${tag}" ]] && continue
                            echo "发现 SNAPSHOT 标签: ${tag}，正在删除..."
                            git tag -d "${tag}"
                            git push origin --delete "${tag}" || echo "远端无 ${tag}，跳过"
                        done <<< "${SNAPSHOT_TAGS}"
                    fi

            -   name: "构建插件"
                env:
                    PLUGIN_NAME: ${{ steps.resolve.outputs.plugin-name }}
                    RELEASE_VERSION: ${{ steps.resolve.outputs.release-version }}
                run: |
                    set -euo pipefail
                    git log --oneline -5
                    git symbolic-ref --short HEAD

                    # buildPlugin 已在 build.gradle.kts 中把归档版本绑定为 plugin.version，
                    # 产物形如 ToolKit-2.0.0.zip，与 download-url / artifacts 严格一致。
                    # 去掉 --info：成功构建无需海量日志，减少 I/O 与日志体积；
                    # 保留 --stacktrace，失败时仍输出完整堆栈，排障能力不丢失。
                    ./gradlew buildPlugin --stacktrace

                    # 断言产物确实存在，避免 artifacts glob 匹配不到时 release-action 静默跳过上传
                    EXPECTED_ZIP="build/distributions/${PLUGIN_NAME}-${RELEASE_VERSION}.zip"
                    if [[ ! -f "${EXPECTED_ZIP}" ]]; then
                        echo "构建产物缺失：${EXPECTED_ZIP}"
                        echo "build/distributions 实际内容："
                        ls -1 build/distributions/ 2>/dev/null || echo "（目录为空或不存在）"
                        exit 1
                    fi
                    echo "构建产物已确认：${EXPECTED_ZIP}"

            -   name: "版本变更"
                env:
                    DOWNLOAD_URL: ${{ steps.resolve.outputs.download-url }}
                run: |
                    set -euo pipefail
                    echo "插件下载地址: ${DOWNLOAD_URL}"
                    ./gradlew updatePluginXml -Purl="${DOWNLOAD_URL}"

            # 只提交 release 元数据文件，避免 git add . 误提交构建产物等非预期文件
            -   name: "提交版本变更"
                env:
                    RELEASE_VERSION: ${{ steps.resolve.outputs.release-version }}
                    VENDOR_EMAIL: ${{ steps.resolve.outputs.vendor-email }}
                run: |
                    set -euo pipefail
                    git config user.name "${GIT_USER_NAME}"
                    git config user.email "${VENDOR_EMAIL}"

                    git add -- updatePlugins.xml
                    if ! git diff --cached --quiet; then
                        git commit -m "发布版本 ${RELEASE_VERSION}"
                    else
                        echo "updatePlugins.xml 无变更，跳过提交"
                    fi

            -   name: "发布版本"
                uses: ncipollo/release-action@v1.21.0
                with:
                    tag: "v${{ steps.resolve.outputs.release-version }}"
                    name: "v${{ steps.resolve.outputs.release-version }}"
                    body: |
                        发布版本 ${{ steps.resolve.outputs.release-version }}

                        **下载插件包**：[${{ steps.resolve.outputs.plugin-name }}-${{ steps.resolve.outputs.release-version }}.zip](${{ steps.resolve.outputs.download-url }})
                    artifacts: build/distributions/${{ steps.resolve.outputs.plugin-name }}-${{ steps.resolve.outputs.release-version }}.zip
                    # 同版本覆盖：已存在同名 Release 时更新而不是报 422。
                    # release-action 通过 releases.getReleaseByTag(tag_name) 查找已有 Release，
                    # 与本地/远端 git tag 是否存在无关（前面的"清理 Git Tag"不会阻断覆盖路径）。
                    allowUpdates: true
                    # 更新时先按文件名删除同名旧 asset 再上传新包，避免同名 asset 冲突；默认 true，显式声明以防默认值变化。
                    replacesArtifacts: true
                    # 上传/匹配出错即让 workflow 失败（注意：抛错发生在 release 创建/更新之后，
                    # 防止空壳 release 主要靠构建步骤的 test -f 断言）
                    artifactErrorsFailBuild: true
                    prerelease: ${{ contains(steps.resolve.outputs.release-version, 'SNAPSHOT') }}

            -   name: "推送最终结果"
                run: |
                    set -euo pipefail
                    git push origin "${BRANCH_NAME}" || echo "没有需要推送的信息"
